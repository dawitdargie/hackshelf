# Render Blueprint for the HackShelf backend API.
# Deploy via Render dashboard: New -> Blueprint -> pick this repository.
# Secret values are entered in the Render dashboard (sync: false);
# JWT secrets are generated automatically.
#
# The frontend is served by Vercel (see README, Deployment section).

services:
  - type: web
    name: hackshelf-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    # Runs the SQL migrations (idempotent) before the new release goes live.
    preDeployCommand: migrate
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_AUTH
        value: "20"
      - key: RATE_LIMIT_GENERAL
        value: "120"
      - key: RATE_LIMIT_WINDOW
        value: "1m"