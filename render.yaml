# Render Blueprint for the HackShelf backend API.
# Deploy via Render dashboard: New -> Blueprint -> pick this repository.
# Secret values are entered in the Render dashboard (sync: false);
# JWT secrets are generated automatically.
#
# Email: Render blocks outbound SMTP ports, so production uses
# EMAIL_MODE=api (Brevo HTTPS API) with BREVO_API_KEY set in the dashboard.
# The frontend is served by Vercel (see README, Deployment section).
# Note: pre-deploy commands are not available on the free plan, so migrations
# are applied manually from a machine with Go installed (see README).

services:
  - type: web
    name: hackshelf-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: RATE_LIMIT_AUTH
        value: "20"
      - key: RATE_LIMIT_GENERAL
        value: "120"
      - key: RATE_LIMIT_WINDOW
        value: "1m"